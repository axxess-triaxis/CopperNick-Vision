[project]
name = "coppernick"
version = "0.1.0"
description = "AI-native cyclone impact/infrastructure forecaster + passive sky-scanning early-warning system (CopperNick Vision)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3",
    "earthengine-api>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "onvif-zeep-async>=4.2",
    "wsdiscovery>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
